name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PENDIENTE (plan §9): fijar cada acción por SHA de commit con Dependabot en cuanto el
# repositorio tenga acceso desde CI; no se escriben SHAs de memoria para no inventarlos.
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm agents:check

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16-pgtap libtap-parser-sourcehandler-pgtap
      - name: Migraciones + pgTAP (RLS, invariantes, auditoría, ingresos y gastos)
        run: sudo -E bash scripts/db-test-local.sh
      - name: Verificación de seguridad sobre el catálogo (debe devolver 0 filas)
        run: |
          sudo -E bash scripts/db-verify-local.sh | tee /tmp/verify.out
          grep -q '(0 rows)' /tmp/verify.out

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mutation:
    # Prueba de mutación de la seguridad de la base de datos: solo en main y programada.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16-pgtap libtap-parser-sourcehandler-pgtap
      - run: sudo -E python3 scripts/db-mutation-check.py
